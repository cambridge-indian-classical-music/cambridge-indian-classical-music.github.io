# The committee, shown on the About page.
#
# This file is replaced wholesale each year at handover. `order` sets the order
# on the page (1 first). It is needed because the site does NOT keep the order
# of this file — it would otherwise sort by `id`. `id` just has to be unique and
# lowercase — it is not shown.
# `email` is optional; leave it out if a member would rather not publish theirs.
# Never put a personal address here — the society's shared address is in
# src/site.config.ts and is shown on the About page already.
#
# `photo` is optional. Leave it out and the page shows an empty frame of the
# same size, so the row stays even. Photos live in src/assets/images/committee/,
# cropped square. Before adding one, strip its location data (phone photos
# record where they were taken) — this repository is public. Only add a
# photo with that person's agreement.
#
# `note` is optional — a short extra line under the role.
#
# `larger: true` shows that member's photo 20% bigger than the others.

- id: events-officer
  order: 1
  name: S R Gokul Krishnan
  role: Events Officer
  note: (also the creator of this website, which is why the photo size is bigger)
  larger: true
  photo:
    src: ../assets/images/committee/events-officer.jpg
    alt: S R Gokul Krishnan, smiling, seated at a dinner table in a cream kurta and black shawl.


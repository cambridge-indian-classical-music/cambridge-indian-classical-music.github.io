# Keeps dependencies up to date without becoming a chore.
#
# Updates are grouped into a single monthly pull request rather than arriving one
# at a time, because a committee that gets twelve notifications a month will
# start ignoring all of them. Security fixes still arrive immediately.
#
# When one of these appears: check that the "Checks" workflow passed, look at the
# preview deployment, and merge. See docs/MAINTAINING.md.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns: ['*']
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
